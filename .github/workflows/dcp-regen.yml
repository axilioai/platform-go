name: DCP Regenerate

# Fires when the backend publishes a new production DCP contract, and
# regenerates the DCP typed wire layer (drivers/mobile/wire_gen.go) from it.
# The DCP twin of the Fern regen.yml, for the WebSocket protocol instead of the
# REST spec.
#
# The backend's production deploy sends a dcp-contract-updated
# repository_dispatch carrying the sanitized, public-safe contract as YAML
# (base64). This workflow converts it to contracts/dcp-asyncapi.json (the form
# the stdlib Go generator reads), reruns the generator, and opens a regen PR for
# a human to review and merge. Merging does NOT cut a release: the module owns
# its own SemVer, bumped deliberately.
#
# Staging dispatches are ignored: staging may carry unreleased wire surface a
# customer must not get types for. A manual run regenerates from the contract
# already committed here.

on:
  repository_dispatch:
    types: [dcp-contract-updated]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate DCP wire layer
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'dcp-contract-updated' &&
       github.event.client_payload.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the published contract
        # Only on a dispatch: the payload carries the contract as YAML, but the
        # Go generator reads JSON, so convert it (PyYAML ships on the runner).
        # A manual run skips this and regenerates from the committed contract.
        if: github.event.client_payload.contract_b64 != ''
        env:
          CONTRACT_B64: ${{ github.event.client_payload.contract_b64 }}
        run: |
          printf '%s' "$CONTRACT_B64" | base64 -d > /tmp/dcp.yaml
          python3 -c "import yaml, json; json.dump(yaml.safe_load(open('/tmp/dcp.yaml')), open('contracts/dcp-asyncapi.json','w'), indent=2, sort_keys=False)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate the wire layer
        run: go run scripts/gen_dcp_wire.go

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet contracts/dcp-asyncapi.json drivers/mobile/wire_gen.go; then
            echo "DCP wire layer unchanged; nothing to PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected; opening PR."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open regen PR
        if: steps.diff.outputs.changed == 'true'
        # Single reused branch so successive dispatches update one PR rather
        # than stacking duplicates. The regen does NOT bump the module version.
        uses: peter-evans/create-pull-request@v6
        with:
          branch: dcp-regen
          base: main
          add-paths: |
            contracts/dcp-asyncapi.json
            drivers/mobile/wire_gen.go
          title: "chore(dcp): regenerate DCP wire layer"
          commit-message: |
            chore(dcp): regenerate DCP wire layer

            Auto-generated by .github/workflows/dcp-regen.yml from the published
            DCP contract (axilio@${{ github.event.client_payload.axilio_sha || 'manual' }}).
          body: |
            The backend published a DCP contract change (protocol `${{ github.event.client_payload.protocol_version }}`, contract `${{ github.event.client_payload.contract_version }}`).

            This regenerates `drivers/mobile/wire_gen.go` from the updated `contracts/dcp-asyncapi.json`. Review the diff and merge. The wire drift test (`drivers/mobile/wire_gen_test.go`) runs in CI and must pass. Merging does not cut a release.
          labels: dcp-regen
