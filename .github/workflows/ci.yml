name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Windows is a supported customer platform; build, vet and test there too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The test step's package filter is POSIX shell. Windows runners ship
        # Git Bash, so one script serves both platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        # The generated WireMock integration packages (the six */*_test dirs)
        # need a live WireMock server on :8080 that Fern's own test harness
        # provisions; they are not runnable under plain `go test`. Run the real
        # unit tests (pointer/types/client) and skip those integration packages.
        # -race on Linux (it needs cgo, which the Windows runner lacks): the
        # drivers are documented safe for cross-goroutine Close (AXI-2228).
        run: go test ${{ matrix.os == 'ubuntu-latest' && '-race' || '' }} $(go list ./... | grep -v '_test$')
