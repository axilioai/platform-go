# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
#
# Argus (vision inference) -> its own generated client at ./argus, importable
# as github.com/axilioai/platform-go/argus. The Go twin of platform-python's
# fern/apis/argus/generators.yml. Kept as a separate Fern API (not merged into
# the backend spec) on purpose: argus bakes the full /api/v1 prefix into its
# paths and re-declares the X-Axilio-Api-Key apiKey scheme, which clobbers the
# unified client if merged (AXI-1108). Its base URL is argus.axilio.ai, which
# scripts/regen_argus.sh injects as the spec's `servers` entry at generation
# time so the generated clients default to it (the synced spec artifact
# carries no servers array).
#
# Generation is `fern generate --local` (Docker) via scripts/regen_argus.sh,
# which generates into a throwaway ./.gen-argus and rsyncs into ./argus —
# see regen.sh's header for why output never lands directly in the tree.
api:
  specs:
    - openapi: ../../../specs/production/argus-openapi.json
default-group: go-sdk
groups:
  go-sdk:
    generators:
      - name: fern-go-sdk
        version: 1.47.2
        output:
          location: local-file-system
          path: ../../../.gen-argus
        config:
          module:
            path: github.com/axilioai/platform-go/argus
